<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalentFlow · Démo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./app.css">
<style>
  .addbox{margin-top:18px}.addbox summary{cursor:pointer;font-weight:700}
  .addform{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
  .addform input{background:var(--panel-2);color:var(--text);border:1px solid var(--line);padding:10px 12px;border-radius:12px;font:inherit}
  .demo-note{margin-top:14px;font-size:.78rem;color:var(--muted)}
  .demo-note button{margin-top:8px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<aside class="side">
  <a class="logo" href="#/"><span class="mark">TF</span> TalentFlow</a>
  <nav>
    <a href="#/" data-page="dashboard">Tableau de bord</a>
    <a href="#/board" data-page="board">Pipeline</a>
    <a href="#/jobs" data-page="jobs">Offres</a>
  </nav>
  <div class="side-foot">Recrutement IT<br><small>Démo · données fictives</small>
    <p class="demo-note">Mode démo : les modifications restent dans votre navigateur.<br><button id="reset" type="button">Réinitialiser</button></p></div>
</aside>
<main class="main" id="content"></main>
<script type="module" src="./app.js"></script>
</body>
</html>
